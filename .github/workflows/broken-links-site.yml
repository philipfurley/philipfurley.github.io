name: Check for broken links on site

on:
  workflow_run:
    workflows: ["Deploy site", "pages build and deployment"]
    types:
      - completed
  workflow_dispatch:

jobs:
  broken-links:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >
            --verbose
            --no-progress
            --accept 200,204,206,301,302,403,429,999
            --exclude-mail
            --exclude 'https://scholar.google.com*'
            --exclude 'https://www.researchgate.net*'
            --exclude 'https://doi.org*'
            --exclude 'https://www.linkedin.com*'
            --exclude 'https://www.youtube.com*'
            --exclude-path '_pages'
            './**/*.html'
